[workspace]
resolver = "2"
members = ["crates/kairos-cli", "crates/kairos-core", "crates/kairos-store", "crates/kairos-provider", "crates/kairos-runner", "crates/kairos-tui", "crates/kairos-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A persistent, terminal-first personal agent for Linux"
repository = "https://github.com/JDTWOR/kairos"
readme = "README.md"
keywords = ["agent", "cli", "tui", "openrouter", "automation"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
git2 = "0.20"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
